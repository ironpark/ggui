name: CI

# A change to the documentation alone runs nothing: no test reads a
# Markdown file or the recordings under assets/demos. Runnable Go examples
# live under docs/examples/, so non-Markdown changes under docs/ still run CI.
# Otherwise the changes job says what changed, and each job runs only for
# what it tests: the library, the ggui command with its watcher, or
# both. A change to CI itself, the nightly run and a run by hand run
# everything.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'assets/demos/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'assets/demos/**'
  # Every job, fuzzing included, nightly and by hand.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lib is the library and everything built on it in this repository but
  # the command: the root module, the examples, fonts and icon modules,
  # and cmd/ggviewer. cmd is the ggui command and pkg/fswatch, whose
  # tests build an app against this checkout, so a change to the library
  # runs them too.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      lib: ${{ steps.filter.outputs.lib == 'true' || steps.all.outputs.all == 'true' }}
      cmd: ${{ steps.filter.outputs.lib == 'true' || steps.filter.outputs.cmd == 'true' || steps.all.outputs.all == 'true' }}
      package: ${{ steps.filter.outputs.cmd == 'true' || steps.all.outputs.all == 'true' }}
      all: ${{ steps.all.outputs.all == 'true' }}
    steps:
      - uses: actions/checkout@v7
      # A nightly run or one by hand has nothing to compare with, and
      # runs everything.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            lib:
              - '**'
              - '!cmd/ggui/**'
              - '!pkg/fswatch/**'
              - '!.github/**'
              - '!**.md'
              - '!assets/demos/**'
            cmd:
              - '{cmd/ggui,pkg/fswatch}/**'
              - '!**.md'
            ci:
              - '{.github/**,internal/tools/**,Taskfile.yml}'
      - id: all
        run: echo "all=${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.ci == 'true' }}" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.lib == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            docs/examples/sqlite/go.sum
            fonts/notoemoji/go.sum
            icons/heroicons/go.sum
            icons/lucide/go.sum
            icons/tabler/go.sum
            cmd/ggui/go.sum
            pkg/fswatch/go.sum
      # docs/examples/sqlite, fonts/notoemoji and the icon libraries under icons
      # are modules of their own that
      # require a published ggui; the workspace makes them build against
      # this checkout instead. cmd/ggui, the ggui command, is a module of
      # its own so its dependencies stay out of ggui's; it imports no ggui,
      # but its tests build an app against this checkout, and are run by
      # the command job. pkg/fswatch, the file watcher, is a module of its
      # own the command requires. The developer's own go.work, which also points at ../ggfx, is not
      # committed.
      - name: Workspace
        run: |
          go work init . ./docs/examples/sqlite ./fonts/notoemoji ./icons/heroicons ./icons/lucide ./icons/tabler ./cmd/ggui ./pkg/fswatch
      # The Ubuntu image has DejaVu Sans but no font for Korean, which the
      # system font fallback is tested with. Mesa supplies a surfaceless EGL
      # context for the offscreen text rendering tests.
      - name: Install test fonts and Mesa
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri
      - name: Test
        run: go test ./... ./docs/examples/sqlite/... ./fonts/notoemoji/... ./icons/heroicons/... ./icons/lucide/... ./icons/tabler/...
      - name: Test with the inspector
        run: go test -tags ggui_inspector . ./widget
      - name: Test the debug build
        run: go test -tags ggui_debug . ./widget ./internal/reactive
      # The build ggui dev shows in its viewer: ggwd's remote backend is
      # linked in. The tests set the viewer's socket in the environment and
      # need no viewer.
      - name: Test the remote display build
        shell: bash
        run: |
          go test -tags ggwd_remote . ./internal/platform/... ./runtime
          go build -tags ggwd_remote,ggui_inspector,ggui_debug -o "$RUNNER_TEMP/counter-remote" ./docs/examples/counter

  # The ggui command and its watcher, beside the library's tests rather than
  # after them: they build apps against this checkout and take as long.
  command:
    name: command (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.cmd == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/ggui/go.sum
            pkg/fswatch/go.sum
      - name: Workspace
        run: go work init . ./cmd/ggui ./pkg/fswatch
      - name: Test
        run: go test ./cmd/ggui/... ./pkg/fswatch/...
      # The ggui command's watcher once more, scanning without the
      # system's notifications, and fswatch, where cgo is the default,
      # without cgo: on macOS FSEvents calls back into Go on a thread of its
      # own, which purego's fakecgo then makes possible. fswatch's own tests
      # run each case both notified and polling.
      - name: Test the watcher by polling and without cgo
        shell: bash
        run: |
          GGUI_WATCH=poll go test ./cmd/ggui/internal/watch/... ./cmd/ggui/internal/dev/...
          CGO_ENABLED=0 go test ./pkg/fswatch/... ./cmd/ggui/internal/watch/...
      # pkg/fswatch and cmd/ggui do not import root ggui and must remain
      # self-contained for standalone builds (such as go install) without a
      # go.work file.
      - name: Verify standalone modules (GOWORK=off)
        shell: bash
        run: |
          GOWORK=off go -C pkg/fswatch build ./...
          GOWORK=off go -C pkg/fswatch vet ./...
          GOWORK=off go -C pkg/fswatch test -run='^$' ./...
          GOWORK=off go -C cmd/ggui build ./...
          GOWORK=off go -C cmd/ggui vet ./...
          GOWORK=off go -C cmd/ggui test -run='^$' ./...

  # Probe tests run under t.Parallel, and -race is what shows that no
  # probe reaches another's state. It needs cgo, which the Windows runner
  # has no C toolchain configured for, and finds the same races on one
  # system as on another: it runs on Linux, beside the other tests.
  race:
    needs: changes
    if: needs.changes.outputs.lib == 'true' || needs.changes.outputs.cmd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/ggui/go.sum
            pkg/fswatch/go.sum
      - name: Workspace
        run: go work init . ./cmd/ggui ./pkg/fswatch
      - name: Install test fonts and Mesa
        if: needs.changes.outputs.lib == 'true'
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri
      - name: Test with the race detector
        if: needs.changes.outputs.lib == 'true'
        run: go test -race ./...
      - name: Test fswatch and command with the race detector
        if: needs.changes.outputs.cmd == 'true'
        shell: bash
        run: |
          go -C pkg/fswatch test -race ./...
          go -C cmd/ggui test -race ./...

  # The viewer and docs/examples/counter with the remote backend, end to end, on
  # the runner's window system and GPU: cmd/ggviewer's TestEndToEnd. Linux
  # draws with Mesa's software OpenGL under Xvfb, with openbox to minimize
  # the window; Windows' runner has no GPU, and DirectX draws with WARP.
  remote:
    name: remote (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.lib == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install an X server, a window manager and Mesa
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri xvfb openbox
          Xvfb :99 -screen 0 1280x1024x24 &
          echo DISPLAY=:99 >> "$GITHUB_ENV"
          sleep 1
          DISPLAY=:99 openbox &
      - name: End to end
        env:
          GGUI_E2E: "1"
          GGFX_DIRECTX: warp
        run: GGUI_E2E_DIR="$RUNNER_TEMP/e2e" go test -count=1 -v -run '^TestEndToEnd$' ./cmd/ggviewer
      - name: Keep the window's pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  # What ggui build --target linux makes must install and run where people
  # put it: the .deb with apt on Ubuntu, where the app is started under
  # Xvfb and its window must carry the class the desktop file names, which
  # is how a dock finds the app's icon; and the .rpm with dnf on Fedora,
  # whose dependencies must name the packages that hold the libraries the
  # app opens.
  linux-package:
    name: linux package
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/ggui/go.sum
            pkg/fswatch/go.sum
      - name: Build an app's packages
        run: |
          go -C cmd/ggui build -o "$RUNNER_TEMP/ggui" .
          "$RUNNER_TEMP/ggui" init --name "Hello World" --replace "$GITHUB_WORKSPACE" "$RUNNER_TEMP/hello"
          cd "$RUNNER_TEMP/hello"
          "$RUNNER_TEMP/ggui" build --target linux --format tar,deb,rpm
          ls -l build
      - name: Install the .deb and run it under Xvfb
        run: |
          cd "$RUNNER_TEMP/hello/build"
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils ./*.deb
          desktop=$(dpkg -L hello-world | grep '^/usr/share/applications/.*\.desktop$')
          class=$(sed -n 's/^StartupWMClass=//p' "$desktop")
          echo "desktop file $desktop, StartupWMClass=$class"
          test -n "$class"
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1
          hello-world > "$RUNNER_TEMP/app.log" 2>&1 &
          app=$!
          for i in $(seq 1 30); do
            if xwininfo -root -tree | grep -F "(\"" | grep -qF "\"$class\")"; then break; fi
            sleep 1
          done
          xwininfo -root -tree | grep -F "(\"" || true
          kill -0 "$app" || { echo "the app exited:"; cat "$RUNNER_TEMP/app.log"; exit 1; }
          xwininfo -root -tree | grep -F "(\"" | grep -qF "\"$class\")" || { echo "no window of class $class"; cat "$RUNNER_TEMP/app.log"; exit 1; }
          kill "$app"
      - name: Install the .rpm on Fedora
        run: |
          docker run --rm -v "$RUNNER_TEMP/hello/build:/pkgs:ro" fedora:latest sh -euxc '
            dnf install -y /pkgs/*.rpm
            rpm -ql hello-world
            for lib in libX11.so.6 libXrandr.so.2 libXi.so.6 libXcursor.so.1 libXinerama.so.1 libXext.so.6 libXrender.so.1 libGL.so.1 libEGL.so.1; do
              ldconfig -p | grep -qF "$lib" || { echo "missing $lib"; exit 1; }
            done
          '

  # ggui signs a macOS app on Linux with zapp's rcodesign library, which a
  # build of the command with cgo links: one built with the runner's GCC,
  # and one cross-built with zig as the release's are. The certificate is
  # a throwaway self-signed one with the Code Signing usage, named as a
  # Developer ID Application certificate is, since ggui's own checks after
  # signing want that name. Each build ends with those checks, rcodesign's
  # verification of every binary's signature among them; the macOS job
  # below then checks the signatures with codesign. Notarizing needs
  # Apple's credentials, which CI has none of: it is not tested.
  sign-linux:
    name: sign a macOS app on Linux
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    env:
      CERT_CN: 'Developer ID Application: ggui CI (GGUITEST01)'
      GGUI_P12_PASSWORD: ci-throwaway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/ggui/go.sum
            pkg/fswatch/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build the command with cgo
        env:
          CGO_ENABLED: '1'
        run: |
          lib=github.com/ironpark/zapp/pkg/signing/rcodesign/lib
          go -C cmd/ggui list -deps . | grep -qx "$lib"
          go -C cmd/ggui build -o "$RUNNER_TEMP/ggui-gcc" .
          # As cmd/ggui/.goreleaser.yaml builds the release binaries.
          CC="zig cc -target x86_64-linux-gnu.2.28" CGO_LDFLAGS=-lunwind \
            go -C cmd/ggui build -trimpath -o "$RUNNER_TEMP/ggui-zig" .
          mkdir -p "$RUNNER_TEMP/windows"
          GOOS=windows GOARCH=amd64 CC="zig cc -target x86_64-windows-gnu" \
            CGO_LDFLAGS="-L$GITHUB_WORKSPACE/cmd/ggui/release/mingw -lunwind" \
            go -C cmd/ggui build -trimpath -tags ggui_rcodesign -o "$RUNNER_TEMP/windows/ggui.exe" .
          # Without the tag a Windows build with cgo leaves the library out,
          # as the Windows runner's does: its cgo uses MinGW's GCC, not the
          # LLVM MinGW the library is built with.
          if GOOS=windows GOARCH=amd64 go -C cmd/ggui list -deps . | grep -qx "$lib"; then
            echo "a Windows build without ggui_rcodesign links rcodesign"; exit 1
          fi
          "$RUNNER_TEMP/ggui-gcc" doctor || true
      - name: Make a self-signed code signing certificate
        run: |
          cd "$RUNNER_TEMP"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -keyout key.pem -out cert.pem \
            -subj "/CN=$CERT_CN/OU=GGUITEST01/O=ggui CI" \
            -addext "basicConstraints=critical,CA:FALSE" \
            -addext "keyUsage=critical,digitalSignature" \
            -addext "extendedKeyUsage=critical,codeSigning"
          openssl pkcs12 -export -inkey key.pem -in cert.pem -out windows/cert.p12 -passout env:GGUI_P12_PASSWORD
      - name: Sign an app with each build
        run: |
          "$RUNNER_TEMP/ggui-gcc" init --name "Hello World" --replace "$GITHUB_WORKSPACE" "$RUNNER_TEMP/hello"
          cd "$RUNNER_TEMP/hello"
          mkdir -p "$RUNNER_TEMP/signed"
          for cc in gcc zig; do
            "$RUNNER_TEMP/ggui-$cc" build --target macos --p12-file "$RUNNER_TEMP/windows/cert.p12" --out "$RUNNER_TEMP/out-$cc"
            # zip -y keeps symbolic links as links, as ditto does.
            (cd "$RUNNER_TEMP/out-$cc" && zip -q -y -r "$RUNNER_TEMP/signed/hello-$cc.zip" "Hello World.app")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: signed-on-linux
          path: ${{ runner.temp }}/signed
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ggui-windows
          path: ${{ runner.temp }}/windows
          if-no-files-found: error

  # The Windows release binary, cross-built above, signs an app on Windows;
  # its build ends with ggui's checks, rcodesign's verification among them.
  sign-windows:
    name: sign a macOS app on Windows
    needs: sign-linux
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GGUI_P12_PASSWORD: ci-throwaway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: ggui-windows
          path: ${{ runner.temp }}/ggui
      - name: Sign an app
        run: |
          ggui="$RUNNER_TEMP/ggui/ggui.exe"
          "$ggui" doctor || true
          "$ggui" init --name "Hello World" --replace "$GITHUB_WORKSPACE" "$RUNNER_TEMP/hello"
          cd "$RUNNER_TEMP/hello"
          "$ggui" build --target macos --p12-file "$RUNNER_TEMP/ggui/cert.p12" --out "$RUNNER_TEMP/out"

  # What was signed on Linux, checked by Apple's codesign: the signature's
  # integrity, the code directory, the sealed resources and the designated
  # requirement, not trust, which a self-signed certificate has none of:
  # codesign --verify without -R does not evaluate the certificate's
  # trust. Gatekeeper's verdict, which does, is printed, not checked.
  verify-signed-on-linux:
    name: verify on macOS what was signed on Linux
    needs: sign-linux
    runs-on: macos-26
    env:
      CERT_CN: 'Developer ID Application: ggui CI (GGUITEST01)'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-on-linux
          path: ${{ runner.temp }}/signed
      - name: codesign
        run: |
          cd "$RUNNER_TEMP/signed"
          for cc in gcc zig; do
            echo "::group::signed by the $cc build"
            mkdir "$cc"
            ditto -x -k "hello-$cc.zip" "$cc"
            app="$cc/Hello World.app"
            codesign -dvvv "$app" 2>&1 | tee info.txt
            grep -qxF "Authority=$CERT_CN" info.txt || { echo "the signing authority is not $CERT_CN"; exit 1; }
            grep -q '^Timestamp=' info.txt || { echo "no secure timestamp"; exit 1; }
            grep -q 'flags=.*runtime' info.txt || { echo "no hardened runtime"; exit 1; }
            codesign --verify --strict --deep -vv "$app"
            spctl --assess --type execute -vv "$app" || true
            echo "::endgroup::"
          done

  wasm:
    needs: changes
    if: needs.changes.outputs.lib == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Build
        run: GOOS=js GOARCH=wasm go build ./...
      # Only the packages that do not start ggfx run under node: ggfx wants
      # a browser. internal/reactive/goid is the one that matters most: wasm
      # has no getg, and gives every goroutine one id rather than parse a
      # stack on each signal read.
      - name: Test
        run: >-
          GOOS=js GOARCH=wasm go test
          -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec"
          ./internal/reactive/goid ./internal/reactive ./internal/textedit
          ./a11y ./inspect ./runtime

  # Each fuzz target's seeds already run in test; this explores a little
  # beyond them, nightly and by hand, as it takes five minutes and finds
  # nothing a push needs to wait on.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fuzz
        run: FUZZTIME=5s internal/tools/fuzz.sh

  # gofmt once; vet and staticcheck once per platform, side by side, since
  # each platform compiles code the others do not, so code unused on one
  # platform alone is not dead. staticcheck keeps what it learned of
  # packages that did not change in its cache.
  lint:
    name: lint (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, darwin/arm64, windows/amd64, windows/arm64]
    runs-on: ubuntu-latest
    env:
      PKGS: ./... ./docs/examples/sqlite/... ./fonts/notoemoji/... ./icons/heroicons/... ./icons/lucide/... ./icons/tabler/... ./cmd/ggui/... ./pkg/fswatch/...
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/ggui/go.sum
            pkg/fswatch/go.sum
      - name: Workspace
        run: |
          go work init . ./docs/examples/sqlite ./fonts/notoemoji ./icons/heroicons ./icons/lucide ./icons/tabler ./cmd/ggui ./pkg/fswatch
          echo "GOOS=${PLATFORM%/*}" >> "$GITHUB_ENV"
          echo "GOARCH=${PLATFORM#*/}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - name: gofmt
        if: matrix.platform == 'linux/amd64'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi
      # The Windows accessibility bridge needs unsafeptr off; see
      # vet:windows in Taskfile.yml. The ggui command's job object code and
      # the watcher are vetted with it on.
      - name: vet
        run: |
          if [ "$GOOS" = windows ]; then
            go vet -unsafeptr=false ./...
            go vet -unsafeptr=false -tags ggui_inspector .
            go vet ./cmd/ggui/... ./pkg/fswatch/...
          else
            go vet $PKGS
            go vet -tags ggui_inspector .
          fi
      - uses: actions/cache@v4
        with:
          path: ~/.cache/staticcheck
          key: staticcheck-${{ matrix.platform }}-${{ hashFiles('go.sum', 'cmd/ggui/go.sum', 'pkg/fswatch/go.sum') }}-${{ github.sha }}
          restore-keys: |
            staticcheck-${{ matrix.platform }}-${{ hashFiles('go.sum', 'cmd/ggui/go.sum', 'pkg/fswatch/go.sum') }}-
            staticcheck-${{ matrix.platform }}-
      - name: staticcheck
        run: |
          GOOS= GOARCH= go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck $PKGS
      - name: Build for other architectures
        if: matrix.platform == 'linux/amd64'
        run: |
          GOOS=linux GOARCH=riscv64 go build ./...
