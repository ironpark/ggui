version: '3'

vars:
  GO: '{{default "go" .GO}}'
  # The packages bench:save and bench:compare measure by default. Those
  # among them below the UI are also listed in boundary_test.go, which
  # keeps them from importing it.
  ENGINES: ./internal/reactive ./internal/fontsys ./internal/textlayout ./internal/paragraph ./internal/imgcache ./internal/render ./internal/region ./internal/framestats ./internal/textedit ./pkg/kinetics ./pkg/virtual ./pkg/geom ./pkg/layout

tasks:
  default:
    desc: Format, vet, and test
    cmds:
      - task: all

  all:
    cmds:
      - task: fmt
      - task: vet
      - task: vet:windows
      - task: test

  build:
    desc: Build all packages, with and without the inspector
    cmds:
      - '"{{.GO}}" build ./...'
      # Only the root package has tagged files, so the second pass is scoped to it.
      - '"{{.GO}}" build -tags ggui_inspector .'
      - '"{{.GO}}" build -C examples/sqlite ./...'
      - '"{{.GO}}" build -C fonts/notoemoji ./...'

  test:
    desc: Run all tests, including the modules nested in this one
    # Both configurations: the tagged run is the only one that exercises the
    # inspector's own tests, the plain one the only one that proves the
    # stub keeps an app running without it.
    cmds:
      - '"{{.GO}}" test ./...'
      - '"{{.GO}}" test -tags ggui_inspector .'
      - '"{{.GO}}" test -C examples/sqlite ./...'
      - '"{{.GO}}" test -C fonts/notoemoji ./...'

  bench:
    desc: Run benchmarks (COUNT=6 by default, for benchstat)
    vars:
      COUNT: '{{default 6 .COUNT}}'
    cmds:
      - '"{{.GO}}" test -run xxx -bench . -count {{.COUNT}} ./...'

  # The engine packages' benchmarks run alone, with no window or GPU: what
  # a refactor of reactivity, text, motion, virtual lists, repaint regions
  # or geometry is measured with. PKGS=./... takes in the rest.
  bench:save:
    desc: Save benchmarks to .bench/NAME.txt (NAME=base, PKGS=engines, BENCH=., COUNT=6)
    vars:
      NAME: '{{default "base" .NAME}}'
      PKGS: '{{default .ENGINES .PKGS}}'
      BENCH: '{{default "." .BENCH}}'
      COUNT: '{{default 6 .COUNT}}'
    cmds:
      - mkdir -p .bench
      - '"{{.GO}}" test -run "^$" -bench "{{.BENCH}}" -benchmem -count {{.COUNT}} {{.PKGS}} | tee .bench/{{.NAME}}.txt'

  bench:compare:
    desc: Compare benchmarks now with .bench/BASE.txt (BASE=base), or with git ref REF, by benchstat
    # REF runs the baseline in a temporary worktree of that commit, so a
    # change is measured against where it started without stashing it:
    # task bench:compare REF=main. Benchmarks the ref does not have are
    # left out of the comparison. Install benchstat with
    # go install golang.org/x/perf/cmd/benchstat@latest
    vars:
      BASE: '{{default "base" .BASE}}'
      PKGS: '{{default .ENGINES .PKGS}}'
      BENCH: '{{default "." .BENCH}}'
      COUNT: '{{default 6 .COUNT}}'
      BENCHSTAT: '{{default "benchstat" .BENCHSTAT}}'
      BASEFILE: '{{if .REF}}.bench/ref.txt{{else}}.bench/{{.BASE}}.txt{{end}}'
    cmds:
      - mkdir -p .bench
      - |
        if [ -n "{{.REF}}" ]; then
          dir=$(mktemp -d)
          git worktree add --detach "$dir" "{{.REF}}" >/dev/null
          pkgs=""
          for p in {{.PKGS}}; do
            if [ -d "$dir/$p" ]; then pkgs="$pkgs $p"; fi
          done
          (cd "$dir" && "{{.GO}}" test -run "^$" -bench "{{.BENCH}}" -benchmem -count {{.COUNT}} $pkgs) > {{.BASEFILE}}
          status=$?
          git worktree remove --force "$dir"
          exit $status
        fi
      - 'test -f {{.BASEFILE}} || (echo "no baseline {{.BASEFILE}}: run task bench:save, or pass REF" >&2; exit 1)'
      - '"{{.GO}}" test -run "^$" -bench "{{.BENCH}}" -benchmem -count {{.COUNT}} {{.PKGS}} | tee .bench/new.txt'
      - '{{.BENCHSTAT}} {{.BASEFILE}} .bench/new.txt'

  vet:
    desc: Run Go static checks
    cmds:
      - '"{{.GO}}" vet ./...'
      - '"{{.GO}}" vet -tags ggui_inspector .'
      - '"{{.GO}}" vet -C examples/sqlite ./...'
      - '"{{.GO}}" vet -C fonts/notoemoji ./...'

  vet:windows:
    desc: Type-check and vet the Windows build from any host
    # The Windows accessibility bridge is the one part of the tree that no
    # other platform compiles, and it is cgo-free, so it can at least be
    # built and vetted from here. unsafeptr is off because a COM method
    # receives its out parameters as plain integers from the operating
    # system: turning one back into a pointer is the whole job, and the
    # memory it points at was never Go's to lose track of.
    cmds:
      - 'GOOS=windows GOARCH=amd64 "{{.GO}}" vet -unsafeptr=false ./...'
      - 'GOOS=windows GOARCH=amd64 "{{.GO}}" vet -unsafeptr=false -tags ggui_inspector .'
      - 'GOOS=windows GOARCH=arm64 "{{.GO}}" vet -unsafeptr=false -tags ggui_inspector .'
      - 'GOOS=windows GOARCH=arm64 "{{.GO}}" vet -unsafeptr=false ./...'
      - 'GOOS=windows GOARCH=amd64 "{{.GO}}" test -c -o /dev/null ./internal/platform/a11ybridge'
      - 'GOOS=windows GOARCH=arm64 "{{.GO}}" test -c -o /dev/null ./internal/platform/a11ybridge'

  lint:
    desc: Run staticcheck for every platform the tree has code for
    # Code a platform does not compile looks unused on it, so each platform
    # is checked on its own. Install with
    # go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
    cmds:
      - for: [darwin/arm64, linux/amd64, windows/amd64, windows/arm64]
        cmd: 'GOOS={{splitList "/" .ITEM | first}} GOARCH={{splitList "/" .ITEM | last}} staticcheck ./... ./examples/sqlite/... ./fonts/notoemoji/...'

  fuzz:
    desc: Run every fuzz target for FUZZTIME each (default 10s)
    cmds:
      - internal/tools/fuzz.sh

  fmt:
    desc: Format Go sources
    cmds:
      - '"{{.GO}}" fmt ./...'
      - '"{{.GO}}" fmt -C examples/sqlite ./...'
      - '"{{.GO}}" fmt -C fonts/notoemoji ./...'

  tidy:
    desc: Tidy Go dependencies
    cmds:
      - '"{{.GO}}" mod tidy'
      - '"{{.GO}}" mod tidy -C examples/sqlite'
      - '"{{.GO}}" mod tidy -C fonts/notoemoji'
      - '"{{.GO}}" work sync'

  bundle:
    desc: Build a macOS app bundle (EXAMPLE=counter, todo, workspace, gallery, create, or router)
    vars:
      EXAMPLE: '{{default "counter" .EXAMPLE}}'
      # Empty by default: a bundle is a release build. launch sets it.
      TAGS: '{{default "" .TAGS}}'
    requires:
      vars:
        - name: EXAMPLE
          enum: [counter, todo, workspace, gallery, create, router]
    preconditions:
      - sh: 'test "$(uname -s)" = Darwin'
        msg: App bundles require macOS.
    cmds:
      - |
        mkdir -p 'bin/ggui-{{.EXAMPLE}}.app/Contents/MacOS'
        "{{.GO}}" build {{if .TAGS}}-tags {{.TAGS}} {{end}}-o 'bin/ggui-{{.EXAMPLE}}.app/Contents/MacOS/ggui-{{.EXAMPLE}}' './examples/{{.EXAMPLE}}'
      - |
        cat > 'bin/ggui-{{.EXAMPLE}}.app/Contents/Info.plist' <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleExecutable</key>
          <string>ggui-{{.EXAMPLE}}</string>
          <key>CFBundleIdentifier</key>
          <string>io.github.ironpark.ggui.{{.EXAMPLE}}</string>
          <key>CFBundleName</key>
          <string>ggui-{{.EXAMPLE}}</string>
          <key>CFBundleDisplayName</key>
          <string>ggui · {{.EXAMPLE}}</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleInfoDictionaryVersion</key>
          <string>6.0</string>
          <key>CFBundleShortVersionString</key>
          <string>0.1.0</string>
          <key>CFBundleVersion</key>
          <string>1</string>
          <key>NSHighResolutionCapable</key>
          <true/>
        </dict>
        </plist>
        PLIST
      - "plutil -lint 'bin/ggui-{{.EXAMPLE}}.app/Contents/Info.plist'"

  run:
    desc: Bundle and launch the counter example
    cmds:
      - task: launch
        vars: {EXAMPLE: counter}

  run-todo:
    desc: Bundle and launch the todo example
    cmds:
      - task: launch
        vars: {EXAMPLE: todo}

  run-workspace:
    desc: Bundle and launch the workspace dashboard
    cmds:
      - task: launch
        vars: {EXAMPLE: workspace}

  run-gallery:
    desc: Bundle and launch the component gallery
    cmds:
      - task: launch
        vars: {EXAMPLE: gallery}

  run-create:
    desc: Bundle and launch the theme playground
    cmds:
      - task: launch
        vars: {EXAMPLE: create}

  launch:
    internal: true
    # The run-* tasks are the development loop, so they get the inspector.
    cmds:
      - task: bundle
        vars: {EXAMPLE: '{{.EXAMPLE}}', TAGS: ggui_inspector}
      - "open -n 'bin/ggui-{{.EXAMPLE}}.app'"

  serve:
    desc: Build an example for js/wasm and serve it (EXAMPLE=gallery, PORT=3000, WASM_OPT=-Oz or empty to skip)
    vars:
      EXAMPLE: '{{default "gallery" .EXAMPLE}}'
      PORT: '{{default "3000" .PORT}}'
      # The dev loop, so the served app gets the inspector by default.
      TAGS: '{{default "ggui_inspector" .TAGS}}'
      # Mirrors the server's own default; set WASM_OPT= to skip the pass.
      WASM_OPT: '{{default "-O2" .WASM_OPT}}'
    requires:
      vars:
        - name: EXAMPLE
          enum: [counter, todo, workspace, gallery, create, router]
    cmds:
      - '"{{.GO}}" run ./internal/tools/serve -http ":{{.PORT}}" -wasm-opt "{{.WASM_OPT}}" -tags "{{.TAGS}}" "./examples/{{.EXAMPLE}}"'

  serve-gallery:
    desc: Serve the component gallery in a browser at http://localhost:3000
    cmds:
      - task: serve
        vars: {EXAMPLE: gallery, PORT: 3000}

  clean:
    desc: Clean Go build artifacts and app bundles
    cmds:
      - '"{{.GO}}" clean'
      - rm -rf bin
