version: '3'

vars:
  GO: '{{default "go" .GO}}'
  # The packages bench:save and bench:compare measure by default. Those
  # among them below the UI are also listed in boundary_test.go, which
  # keeps them from importing it.
  ENGINES: ./internal/reactive ./internal/fontsys ./internal/textlayout ./internal/paragraph ./internal/imgcache ./internal/render ./internal/region ./internal/framestats ./internal/textedit ./internal/editlayout ./pkg/kinetics ./pkg/virtual ./pkg/geom ./pkg/layout ./pkg/markdown

tasks:
  default:
    desc: Format, vet, and test
    cmds:
      - task: all

  all:
    cmds:
      - task: fmt
      - task: vet
      - task: vet:windows
      - task: test

  build:
    desc: Build all packages, with and without the inspector
    cmds:
      - '"{{.GO}}" build ./...'
      # Only the root package has tagged files, so the second pass is scoped to it.
      - '"{{.GO}}" build -tags ggui_inspector .'
      # What ggui dev runs in its viewer, ggwd's remote backend linked in.
      - '"{{.GO}}" build -tags ggwd_remote,ggui_inspector,ggui_debug ./...'
      - '"{{.GO}}" build -C examples/sqlite ./...'
      - '"{{.GO}}" build -C fonts/notoemoji ./...'
      - '"{{.GO}}" build -C icons/heroicons ./...'
      - '"{{.GO}}" build -C icons/lucide ./...'
      - '"{{.GO}}" build -C icons/tabler ./...'
      - '"{{.GO}}" build -C cmd/ggui ./...'
      - '"{{.GO}}" build -C pkg/fswatch ./...'

  test:
    desc: Run all tests, including the modules nested in this one
    # Both configurations: the tagged run is the only one that exercises the
    # inspector's own tests, the plain one the only one that proves the
    # stub keeps an app running without it. widget's tests and
    # internal/apitest's drive the ggui package through its public surface,
    # so they run under both.
    cmds:
      - '"{{.GO}}" test ./...'
      - '"{{.GO}}" test -tags ggui_inspector . ./widget ./internal/apitest'
      - '"{{.GO}}" test -tags ggwd_remote . ./internal/platform/... ./runtime'
      - '"{{.GO}}" test -C examples/sqlite ./...'
      - '"{{.GO}}" test -C fonts/notoemoji ./...'
      - '"{{.GO}}" test -C icons/heroicons ./...'
      - '"{{.GO}}" test -C icons/lucide ./...'
      - '"{{.GO}}" test -C icons/tabler ./...'
      - '"{{.GO}}" test -C cmd/ggui ./...'
      - '"{{.GO}}" test -C pkg/fswatch ./...'

  bench:
    desc: Run benchmarks (COUNT=6 by default, for benchstat)
    vars:
      COUNT: '{{default 6 .COUNT}}'
    cmds:
      - '"{{.GO}}" test -run xxx -bench . -count {{.COUNT}} ./...'

  # The engine packages' benchmarks run alone, with no window or GPU: what
  # a refactor of reactivity, text, motion, virtual lists, repaint regions
  # or geometry is measured with. PKGS=./... takes in the rest.
  bench:save:
    desc: Save benchmarks to .bench/NAME.txt (NAME=base, PKGS=engines, BENCH=., COUNT=6)
    vars:
      NAME: '{{default "base" .NAME}}'
      PKGS: '{{default .ENGINES .PKGS}}'
      BENCH: '{{default "." .BENCH}}'
      COUNT: '{{default 6 .COUNT}}'
    cmds:
      - mkdir -p .bench
      - '"{{.GO}}" test -run "^$" -bench "{{.BENCH}}" -benchmem -count {{.COUNT}} {{.PKGS}} | tee .bench/{{.NAME}}.txt'

  bench:compare:
    desc: Compare benchmarks now with .bench/BASE.txt (BASE=base), or with git ref REF, by benchstat
    # REF runs the baseline in a temporary worktree of that commit, so a
    # change is measured against where it started without stashing it:
    # task bench:compare REF=main. Benchmarks the ref does not have are
    # left out of the comparison. Install benchstat with
    # go install golang.org/x/perf/cmd/benchstat@latest
    vars:
      BASE: '{{default "base" .BASE}}'
      PKGS: '{{default .ENGINES .PKGS}}'
      BENCH: '{{default "." .BENCH}}'
      COUNT: '{{default 6 .COUNT}}'
      BENCHSTAT: '{{default "benchstat" .BENCHSTAT}}'
      BASEFILE: '{{if .REF}}.bench/ref.txt{{else}}.bench/{{.BASE}}.txt{{end}}'
    cmds:
      - mkdir -p .bench
      - |
        if [ -n "{{.REF}}" ]; then
          dir=$(mktemp -d)
          git worktree add --detach "$dir" "{{.REF}}" >/dev/null
          pkgs=""
          for p in {{.PKGS}}; do
            if [ -d "$dir/$p" ]; then pkgs="$pkgs $p"; fi
          done
          (cd "$dir" && "{{.GO}}" test -run "^$" -bench "{{.BENCH}}" -benchmem -count {{.COUNT}} $pkgs) > {{.BASEFILE}}
          status=$?
          git worktree remove --force "$dir"
          exit $status
        fi
      - 'test -f {{.BASEFILE}} || (echo "no baseline {{.BASEFILE}}: run task bench:save, or pass REF" >&2; exit 1)'
      - '"{{.GO}}" test -run "^$" -bench "{{.BENCH}}" -benchmem -count {{.COUNT}} {{.PKGS}} | tee .bench/new.txt'
      - '{{.BENCHSTAT}} {{.BASEFILE}} .bench/new.txt'

  vet:
    desc: Run Go static checks
    cmds:
      - '"{{.GO}}" vet ./...'
      - '"{{.GO}}" vet -tags ggui_inspector .'
      - '"{{.GO}}" vet -C examples/sqlite ./...'
      - '"{{.GO}}" vet -C fonts/notoemoji ./...'
      - '"{{.GO}}" vet -C icons/heroicons ./...'
      - '"{{.GO}}" vet -C icons/lucide ./...'
      - '"{{.GO}}" vet -C icons/tabler ./...'
      - '"{{.GO}}" vet -C cmd/ggui ./...'
      - '"{{.GO}}" vet -C pkg/fswatch ./...'

  vet:windows:
    desc: Type-check and vet the Windows build from any host
    # The Windows accessibility bridge is the one part of the tree that no
    # other platform compiles, and it is cgo-free, so it can at least be
    # built and vetted from here. unsafeptr is off because a COM method
    # receives its out parameters as plain integers from the operating
    # system: turning one back into a pointer is the whole job, and the
    # memory it points at was never Go's to lose track of.
    cmds:
      - 'GOOS=windows GOARCH=amd64 "{{.GO}}" vet -unsafeptr=false ./...'
      - 'GOOS=windows GOARCH=amd64 "{{.GO}}" vet -unsafeptr=false -tags ggui_inspector .'
      - 'GOOS=windows GOARCH=arm64 "{{.GO}}" vet -unsafeptr=false -tags ggui_inspector .'
      - 'GOOS=windows GOARCH=arm64 "{{.GO}}" vet -unsafeptr=false ./...'
      - 'GOOS=windows GOARCH=amd64 "{{.GO}}" vet -C cmd/ggui ./...'
      - 'GOOS=windows GOARCH=amd64 "{{.GO}}" vet -C pkg/fswatch ./...'
      - 'GOOS=windows GOARCH=arm64 "{{.GO}}" vet -C pkg/fswatch ./...'
      - 'GOOS=windows GOARCH=amd64 "{{.GO}}" test -c -o /dev/null ./internal/platform/a11ybridge'
      - 'GOOS=windows GOARCH=arm64 "{{.GO}}" test -c -o /dev/null ./internal/platform/a11ybridge'

  vet:linux:
    desc: Type-check and vet the Linux build from any host
    cmds:
      - 'GOOS=linux GOARCH=amd64 "{{.GO}}" vet ./...'
      - 'GOOS=linux GOARCH=amd64 "{{.GO}}" vet -C cmd/ggui ./...'
      - 'GOOS=linux GOARCH=amd64 "{{.GO}}" vet -C pkg/fswatch ./...'

  check:
    desc: What a push most often fails CI for, without running the tests
    # Of the runs that failed on main, a third failed staticcheck alone and
    # most of the rest in code only Windows or Linux compiles: neither shows
    # in fmt, vet and test on the one system at hand. This is the lint job
    # and the other systems' type-checks, in a minute or two.
    cmds:
      - task: fmt
      - task: vet
      - task: vet:windows
      - task: vet:linux
      - task: lint

  hooks:
    desc: Have git run task check before each push
    cmds:
      - |
        hook="$(git rev-parse --git-path hooks/pre-push)"
        if [ -e "$hook" ] && ! grep -q 'task check' "$hook"; then
          echo "$hook exists and is not this one; add 'task check' to it yourself" >&2
          exit 1
        fi
        mkdir -p "$(dirname "$hook")"
        printf '#!/bin/sh\n# Installed by task hooks: the checks CI most often fails a push for.\n# Skip once with git push --no-verify.\nexec task check\n' > "$hook"
        chmod +x "$hook"
        echo "installed $hook"

  lint:
    desc: Run staticcheck for every platform the tree has code for
    # Code a platform does not compile looks unused on it, so each platform
    # is checked on its own. Install with
    # go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
    cmds:
      - for: [darwin/arm64, linux/amd64, windows/amd64, windows/arm64]
        cmd: 'GOOS={{splitList "/" .ITEM | first}} GOARCH={{splitList "/" .ITEM | last}} staticcheck ./... ./examples/sqlite/... ./fonts/notoemoji/... ./icons/heroicons/... ./icons/lucide/... ./icons/tabler/... ./cmd/ggui/... ./pkg/fswatch/...'

  fuzz:
    desc: Run every fuzz target for FUZZTIME each (default 10s)
    cmds:
      - internal/tools/fuzz.sh

  fmt:
    desc: Format Go sources
    cmds:
      - '"{{.GO}}" fmt ./...'
      - '"{{.GO}}" fmt -C examples/sqlite ./...'
      - '"{{.GO}}" fmt -C fonts/notoemoji ./...'
      - '"{{.GO}}" fmt -C icons/heroicons ./...'
      - '"{{.GO}}" fmt -C icons/lucide ./...'
      - '"{{.GO}}" fmt -C icons/tabler ./...'
      - '"{{.GO}}" fmt -C cmd/ggui ./...'
      - '"{{.GO}}" fmt -C pkg/fswatch ./...'

  tidy:
    desc: Tidy Go dependencies
    cmds:
      - '"{{.GO}}" mod tidy'
      - '"{{.GO}}" mod tidy -C examples/sqlite'
      - '"{{.GO}}" mod tidy -C fonts/notoemoji'
      - '"{{.GO}}" mod tidy -C icons/heroicons'
      - '"{{.GO}}" mod tidy -C icons/lucide'
      - '"{{.GO}}" mod tidy -C icons/tabler'
      - '"{{.GO}}" mod tidy -C cmd/ggui'
      - '"{{.GO}}" mod tidy -C pkg/fswatch'
      - '"{{.GO}}" work sync'

  cli:
    internal: true
    # The ggui command, built into bin/ and rebuilt when its sources
    # change. It is a module of its own, so it is built from its directory;
    # the tasks that use it run from here, so the paths they hand it stay
    # relative to the repository.
    sources:
      - cmd/ggui/**/*
      - pkg/fswatch/**/*
    generates:
      - bin/ggui{{exeExt}}
    cmds:
      - '"{{.GO}}" build -C cmd/ggui -o ../../bin/ggui{{exeExt}} .'

  bundle:
    desc: Build a macOS app bundle with ggui build (EXAMPLE=counter, todo, workspace, gallery, create, or router)
    vars:
      EXAMPLE: '{{default "counter" .EXAMPLE}}'
      # Empty by default: a bundle is a release build. launch sets it.
      TAGS: '{{default "" .TAGS}}'
    requires:
      vars:
        - name: EXAMPLE
          enum: [counter, todo, workspace, gallery, create, router]
    preconditions:
      - sh: 'test "$(uname -s)" = Darwin'
        msg: App bundles require macOS.
    deps: [cli]
    # The bundle's name, identifier and display name come from the
    # example's ggui.toml: bin/ggui-EXAMPLE.app.
    cmds:
      - 'bin/ggui build --target macos --out bin --tags "{{.TAGS}}" ./examples/{{.EXAMPLE}}'

  run:
    desc: Bundle and launch the counter example
    cmds:
      - task: launch
        vars: {EXAMPLE: counter}

  run-todo:
    desc: Bundle and launch the todo example
    cmds:
      - task: launch
        vars: {EXAMPLE: todo}

  run-workspace:
    desc: Bundle and launch the workspace dashboard
    cmds:
      - task: launch
        vars: {EXAMPLE: workspace}

  run-gallery:
    desc: Bundle and launch the component gallery
    cmds:
      - task: launch
        vars: {EXAMPLE: gallery}

  run-create:
    desc: Bundle and launch the theme playground
    cmds:
      - task: launch
        vars: {EXAMPLE: create}

  launch:
    internal: true
    # The run-* tasks are the development loop, so they get the inspector.
    cmds:
      - task: bundle
        vars: {EXAMPLE: '{{.EXAMPLE}}', TAGS: ggui_inspector}
      - "open -n 'bin/ggui-{{.EXAMPLE}}.app'"

  serve:
    desc: Serve an example in a browser with ggui dev --web, which rebuilds and reloads the page on change (EXAMPLE=gallery, PORT=3000, WASM_OPT=-O2 to optimize)
    vars:
      EXAMPLE: '{{default "gallery" .EXAMPLE}}'
      PORT: '{{default "3000" .PORT}}'
      # The dev loop, so the served app gets the inspector by default.
      TAGS: '{{default "ggui_inspector" .TAGS}}'
      # Empty skips wasm-opt, as ggui dev does by default: the pass adds
      # seconds to every rebuild for 2% of the binary.
      WASM_OPT: '{{default "" .WASM_OPT}}'
    requires:
      vars:
        - name: EXAMPLE
          enum: [counter, todo, workspace, gallery, create, router]
    deps: [cli]
    cmds:
      - 'bin/ggui dev --web --port {{.PORT}} --wasm-opt "{{.WASM_OPT}}" --tags "{{.TAGS}}" ./examples/{{.EXAMPLE}}'

  serve-gallery:
    desc: Serve the component gallery in a browser at http://localhost:3000
    cmds:
      - task: serve
        vars: {EXAMPLE: gallery, PORT: 3000}

  serve-create:
    desc: Serve the theme builder in a browser at http://localhost:3000
    cmds:
      - task: serve
        vars: {EXAMPLE: create, PORT: 3000}

  clean:
    desc: Clean Go build artifacts and app bundles
    cmds:
      - '"{{.GO}}" clean'
      - rm -rf bin
